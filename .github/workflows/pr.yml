name: PR
on:
  pull_request:
    branches: [main]
jobs:
  pr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use Git Bash for Bash file execution on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $gitBashDirectory = 'C:\Program Files\Git\bin'
          if (!(Test-Path "$gitBashDirectory\bash.exe")) { throw 'Git Bash is required for Bash execution tests' }
          $gitBashDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify Windows Bash runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bashPath = (Get-Command bash.exe).Source
          Write-Output "Resolved Bash: $bashPath"
          if ($bashPath -ne 'C:\Program Files\Git\bin\bash.exe') { throw "Expected Git Bash, found $bashPath" }
          bash.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Git Bash could not start' }
      - run: npm ci
      - name: Diagnose Windows native runtime resolution
        if: runner.os == 'Windows'
        run: npm run diagnose:windows
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:static
      - name: Install browsers
        run: npx playwright install chromium firefox webkit
        working-directory: packages/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: packages/e2e
      - run: npm run e2e:headless -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run e2e:firefox:headless -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run e2e:webkit:headless -- --trace-renderer-worker
        if: runner.os != 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload diagnostic traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.os }}
          path: '**/renderer-worker-traces/**'
          include-hidden-files: true
