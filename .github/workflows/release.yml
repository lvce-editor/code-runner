name: release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: write
jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use Git Bash for Bash file execution on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/Program Files/Git/bin' >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Upload extension archive
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension.tar.br
  publish-release:
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: extension
      - name: Name the versioned extension archive
        run: mv extension.tar.br "code-runner-${GITHUB_REF_NAME}.tar.br"
      - name: Publish extension release
        uses: softprops/action-gh-release@v2
        with:
          files: code-runner-${{ github.ref_name }}.tar.br
          fail_on_unmatched_files: true
