name: CI
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Use Git Bash for Bash file execution on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:/Program Files/Git/bin' >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run type-check
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:static
      - name: Install browsers
        run: npx playwright install chromium firefox webkit
        working-directory: packages/e2e
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Install browser system dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium firefox webkit
        working-directory: packages/e2e
      - run: npm run e2e:headless -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run e2e:firefox:headless -- --trace-renderer-worker
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - run: npm run e2e:webkit:headless -- --trace-renderer-worker
        if: runner.os != 'Windows'
        env:
          PLAYWRIGHT_BROWSERS_PATH: 0
      - name: Upload diagnostic traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: traces-${{ matrix.os }}
          path: '**/renderer-worker-traces/**'
          include-hidden-files: true
      - name: Upload Pages artifact
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Upload extension archive
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: extension
          path: extension.tar.br
  deploy:
    needs: ci
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
